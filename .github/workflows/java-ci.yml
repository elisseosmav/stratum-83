name: Java 21 tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'pom.xml'
      - 'src/**'
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'pom.xml'
      - 'src/**'
      - '.github/workflows/**'
      - 'scripts/**'

jobs:
  test:
    name: Maven tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run JUnit tests
        run: mvn --batch-mode --no-transfer-progress clean test
      - name: Validate Windows PowerShell scripts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($script in @('scripts/verify-beta2-windows.ps1', 'scripts/publish-current-wiki.ps1')) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($script + ': ' + $_.Message) }
              exit 1
            }
            Write-Host ($script + ': PowerShell syntax is valid.')
          }

